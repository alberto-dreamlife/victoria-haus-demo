<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C7690">
<title>A · solo theme-color</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;color:#fff}
.page{min-height:200vh;background:#5C7690}
.hero{height:70vh;background:#5C7690;display:flex;align-items:flex-end;padding:24px}
.hero h1{font-size:34px;font-weight:600;line-height:1.15}
nav{position:fixed;top:0;left:0;right:0;z-index:90;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
    font-weight:700;letter-spacing:.14em;font-size:13px}
.body-note{background:#12110F;padding:24px 20px;font-size:16px;line-height:1.6}
.body-note b{color:#9DBBD4}
.big{font-size:64px;font-weight:800;padding:20px;opacity:.25}
a{color:#9DBBD4}

body{background-color:#F7F5F0}</style>
</head>
<body>

<nav><a href="index.html" style="text-decoration:none;color:#fff">&larr; VOLVER</a></nav>
<div class="page">
  <div class="hero"><h1>A · solo theme-color</h1></div>
  <div class="body-note">
    <p>Mira <b>la franja de arriba</b>, donde estan la hora y la bateria.</p>
    <p style="margin-top:14px">Si sale <b>azul #5C7690</b>, esta tecnica funciona.<br>
       Si sale <b>crema o blanca</b>, no funciona.</p>
    <p style="margin-top:14px;opacity:.75;font-size:14px">El control. Es lo que hay ahora en la web. Si la barra sale CREMA, confirma que Safari ignora theme-color.</p>
  </div>
  <div class="big">A</div>
</div>
</body>
</html>
